[project]
name = "026-agentcore-chatbot"
version = "0.1.0"
description = "JIRA Knowledge Agent (Aurora Postgres + pgvector) on AWS Bedrock AgentCore"
readme = "README.md"
authors = [
    { name = "Pravin Pardeshi", email = "pravin.pardeshi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "psycopg[binary,pool]>=3.1",
    "pgvector>=0.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "requests>=2.31",
]

[project.optional-dependencies]
agentcore = [
    "bedrock-agentcore>=1.0",
]

[project.scripts]
jira-ingest = "jira_agents.ingestion.pipeline:main"
jira-chat = "jira_agents.cli:main"

[tool.uv_build]
module-root = "src"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
